<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-header">
  <div class="user-info">
    <div class="avatar">👤</div>
    <span>Expense Tracker</span>
  </div>
  <div class="header-icons">
    <div class="icon-btn">🔔<span class="dot"></span></div>
    <div class="icon-btn">⚙️</div>
  </div>
</div>

<div id="home" class="page active">
  <div class="top">
    <small>Total balance</small>
    <h1 id="totalBal">£0</h1>
    <div class="salary-box">
      <span class="salary-icon">💰</span>
      <input id="salaryInput" type="number" placeholder="Enter salary e.g 5000">
      <button id="setSalary">Set Salary</button>
    </div>
    <div class="cards">
      <div class="card in"><span>↗</span><div><b>income</b><strong id="incomeVal">+£0</strong></div></div>
      <div class="card ex"><span>↘</span><div><b>Expenses</b><strong id="expVal">-£0</strong></div></div>
    </div>
  </div>
  <div class="section">
    <div class="section-title"><span>Transactions</span><small>see all</small></div>
    <div class="box" id="transList">No transactions yet</div>
    <div class="form-title">Add Transaction</div>
    <div class="input-box"><span>£</span><input id="amount" type="number" placeholder="0.00"></div>
    <div class="label">Select Category</div>
    <div class="input-box"><select id="category"><option value="">Choose...</option><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option></select></div>
    <div class="label">Date</div>
    <div class="input-box"><input id="date" type="date"><span>📅</span></div>
    <button class="btn" id="addBtn">+ Add Transaction</button>
    <button class="reset" id="resetBtn">Reset All</button>
  </div>
</div>

<div id="budget" class="page">
  <div class="top">
    <small>Total Budget</small>
    <h1 style="color:#111;">£2,000.00</h1>
    <p class="sub">Spent: <span id="bSpent">£0</span> • Remaining: <b id="bRem" style="color:green;">£2,000</b></p>
    <div class="progress"><div id="bProg" style="width:0%"></div></div>
  </div>
  <div class="section"><div class="section-title"><span>Budget Categories</span></div><div id="budgetCats"></div></div>
</div>

<div class="nav">
  <div class="active" data-page="home"><span>🏠</span>Home</div>
  <div data-page="budget"><span>📊</span>Budget</div>
  <div data-page="analysis"><span>🎯</span>Analysis</div>
  <div data-page="profile"><span>👤</span>Profile</div>
</div>
<script src="app.js"></script>
</body>
</html>
