<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Expense Tracker</title>
<link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-top">
    <div class="auth-logo">💰</div>
    <h1>Expense Tracker</h1>
    <p>Create your account</p>
  </div>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-tabs">
        <a href="login.html" class="tab inactive">Login</a>
        <span class="tab active">Register</span>
      </div>
      <div class="pic-row">
        <div class="pic-preview" id="picPreview">
          <span id="picIcon">👤</span>
          <img id="picImg" src="">
        </div>
        <div>
          <input type="file" id="picFile" accept="image/*" hidden>
          <button class="upload-btn" type="button">Upload Photo</button>
          <small>Green arrow - optional</small>
        </div>
      </div>
      <label>Full Name (Orange arrow)</label>
      <div class="input-box"><input id="regName" type="text" placeholder="Prince Oseji"></div>
      <label>Email (Purple arrow)</label>
      <div class="input-box"><input id="regEmail" type="email" placeholder="princeoseji@gmail.com" value="princeoseji@gmail.com"></div>
      <label>Password</label>
      <div class="input-box"><input id="regPass" type="password" placeholder="Create password"></div>
      <label>Confirm Password</label>
      <div class="input-box"><input id="regPass2" type="password" placeholder="Confirm password"></div>
      <button class="btn" id="regBtn">Create Account</button>
      <p class="bottom-link">Have account? <a href="login.html">Login</a></p>
    </div>
  </div>
<script src="auth.js"></script>
</body>
</html>
